<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | 이음</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#2563eb', 900: '#0f2c59' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 w-full max-w-sm">
            <img src="images/logo.png" alt="이음 로고" class="w-11 h-11 object-contain mb-4">
            <h1 class="text-xl font-extrabold text-slate-900 mb-1">관리자 로그인</h1>
            <p class="text-xs text-slate-500 mb-6">문의 내역을 보려면 비밀번호를 입력하세요.</p>
            <input type="password" id="passwordInput" placeholder="비밀번호" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm mb-3 focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <button onclick="login()" class="w-full py-2.5 bg-brand-900 text-white font-bold text-sm rounded-lg hover:bg-brand-800 transition-colors">
                로그인
            </button>
            <p id="loginError" class="text-xs text-red-500 mt-3 hidden">비밀번호가 올바르지 않습니다.</p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="hidden">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 font-bold text-slate-900">
                    <img src="images/logo.png" alt="이음 로고" class="w-8 h-8 object-contain">
                    <span>문의 관리</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="exportToExcel()" class="text-xs font-semibold bg-brand-900 text-white px-3 py-1.5 rounded-lg hover:bg-brand-800">엑셀 다운로드</button>
                    <button onclick="loadInquiries()" class="text-xs font-semibold text-brand-600 hover:underline">새로고침</button>
                    <button onclick="logout()" class="text-xs font-semibold text-slate-500 hover:text-slate-800">로그아웃</button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold text-slate-900">전체 문의 내역 (<span id="totalCount">0</span>건)</h2>
            </div>

            <div id="loadingState" class="text-center py-16 text-slate-400 text-sm">불러오는 중...</div>

            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                <p class="text-slate-500 text-sm">아직 접수된 문의가 없습니다.</p>
            </div>

            <div id="tableWrapper" class="hidden bg-white rounded-2xl border border-slate-200 overflow-hidden overflow-x-auto shadow-sm">
                <table class="w-full text-xs sm:text-sm text-left">
                    <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">접수일시</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">담당자</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">연락처</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">기관명</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">지역</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">솔루션 분야</th>
                            <th class="px-4 py-3 font-bold whitespace-nowrap">세부 제품</th>
                            <th class="px-4 py-3 font-bold">문의 내용</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let currentItems = [];

        function exportToExcel() {
            if (!currentItems.length) {
                alert('다운로드할 문의 내역이 없습니다.');
                return;
            }
            const rows = currentItems.map(item => ({
                '접수일시': formatDate(item.submittedAt),
                '담당자': item.managerName,
                '연락처': item.phone,
                '기관명': item.orgName,
                '지역': item.region || '',
                '솔루션 분야': item.category || '',
                '세부 제품': item.product || '',
                '문의 내용': item.message || ''
            }));
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = [
                { wch: 16 }, { wch: 10 }, { wch: 14 }, { wch: 20 },
                { wch: 14 }, { wch: 18 }, { wch: 30 }, { wch: 40 }
            ];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '문의목록');
            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(wb, `이음_문의목록_${dateStr}.xlsx`);
        }

        function login() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) return;
            sessionStorage.setItem('adminPassword', pw);
            checkAuthAndLoad();
        }

        function logout() {
            sessionStorage.removeItem('adminPassword');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }

        async function checkAuthAndLoad() {
            const pw = sessionStorage.getItem('adminPassword');
            if (!pw) return;

            const ok = await loadInquiries();
            if (ok) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
            } else {
                sessionStorage.removeItem('adminPassword');
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function loadInquiries() {
            const pw = sessionStorage.getItem('adminPassword');
            if (!pw) return false;

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('tableWrapper').classList.add('hidden');

            try {
                const res = await fetch('/api/inquiries', {
                    headers: { 'X-Admin-Password': pw }
                });

                if (res.status === 401) return false;
                if (!res.ok) throw new Error('load failed');

                const data = await res.json();
                renderTable(data.items || []);
                return true;
            } catch (err) {
                document.getElementById('loadingState').textContent = '문의 내역을 불러오지 못했습니다.';
                return true; // keep dashboard visible, show error instead of bouncing to login
            }
        }

        function renderTable(items) {
            currentItems = items;
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('totalCount').textContent = items.length;

            if (items.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('tableWrapper').classList.remove('hidden');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = items.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3 whitespace-nowrap text-slate-500">${formatDate(item.submittedAt)}</td>
                    <td class="px-4 py-3 font-semibold text-slate-900 whitespace-nowrap">${escapeHtml(item.managerName)}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${escapeHtml(item.phone)}</td>
                    <td class="px-4 py-3">${escapeHtml(item.orgName)}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${escapeHtml(item.region || '-')}</td>
                    <td class="px-4 py-3 whitespace-nowrap">${escapeHtml(item.category || '-')}</td>
                    <td class="px-4 py-3">${escapeHtml(item.product || '-')}</td>
                    <td class="px-4 py-3 max-w-xs">${escapeHtml(item.message || '-')}</td>
                </tr>
            `).join('');
        }

        function formatDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        checkAuthAndLoad();
    </script>
</body>
</html>
